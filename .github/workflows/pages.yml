name: Deploy Massar to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html visual-library.html swiftmedia.html launch.html _site/
      - name: Run content and interaction QA
        run: |
          python tests/qa.py
          for file in /tmp/massar-*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            echo "PASS JavaScript syntax: $file"
          done
      - name: Browser interaction tests
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m http.server 4173 --directory _site >/tmp/massar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.cjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
